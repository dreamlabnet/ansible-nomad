---
# File: install_linux_repo.yml - package installation tasks for Nomad

- name: Install OS packages
  ansible.builtin.package:
    name: "{{ nomad_repo_prerequisites }}"
    state: present
  become: true
  when: nomad_repo_prerequisites | length > 0
  tags: installation

- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Clean up previous nomad data
  when: "'nomad' not in ansible_facts.packages"
  become: true
  block:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Stop service nomad, if running
      ansible.builtin.service:
        name: nomad
        state: stopped
        use: "{{ ansible_service_mgr }}"
      when: ansible_facts.services | join is match('.*nomad.*')

    - name: Remove nomad service unit files from previous installation
      ansible.builtin.file:
        path: "{{ service_unit_item }}"
        state: absent
      loop:
        - /usr/lib/systemd/system/nomad.service
        - /lib/systemd/system/nomad.service
        - /etc/init.d/nomad
      loop_control:
        loop_var: service_unit_item

    - name: Remove the user 'nomad'
      ansible.builtin.user:
        name: nomad
        state: absent
        remove: true

- name: Install repository
  when: ansible_os_family|lower in [ 'debian', 'redhat' ]
  become: true
  block:
    - name: Add Redhat/CentOS/Fedora/Amazon Linux repository
      ansible.builtin.command: yum-config-manager --add-repo {{ nomad_repo_url }}
      args:
        creates: /etc/yum.repos.d/hashicorp.repo
      when: >
        ansible_distribution|lower == 'redhat' or
        ansible_distribution|lower == 'centos' or
        ansible_distribution|lower == 'fedora' or
        ansible_distribution|lower == 'amazon' or
        ansible_distribution|lower == 'rocky' or
        ansible_distribution|lower == 'almalinux'

    - name: Add an Apt signing key, uses whichever key is at the URL
      ansible.builtin.apt_key:
        url: "{{ nomad_repo_url }}/gpg"
        state: present
      when: ansible_os_family|lower == 'debian'

    - name: Add Debian/Ubuntu Linux repository
      ansible.builtin.apt_repository:
        repo: deb {{ nomad_repo_url }} {{ ansible_distribution_release }} main
        state: present
        update_cache: true
      when: ansible_os_family|lower == 'debian'

- name: Install nomad package
  ansible.builtin.package:
    name: nomad{{ '=' if ansible_pkg_mgr == 'apt' else '-' }}{{ nomad_version }}{{ '-1' if ansible_pkg_mgr == 'apt' else '' }}
    state: present
  become: true

- name: Create a directory /etc/systemd/system/nomad.service.d
  ansible.builtin.file:
    path: /etc/systemd/system/nomad.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  when: ansible_service_mgr == "systemd"

- name: Override systemd service params
  ansible.builtin.template:
    src: nomad_systemd_service.override.j2
    dest: /etc/systemd/system/nomad.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  register: systemd_override
  become: true
  notify:
    - Reload systemd daemon
    - Restart nomad
  when:
    - ansible_service_mgr == "systemd"
    - nomad_install_from_repo | bool

- name: Reload systemd daemon # noqa no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: systemd_override is changed

- name: Delete default nomad.hcl
  ansible.builtin.file:
    path: /etc/nomad.d/nomad.hcl
    state: absent
  become: true
