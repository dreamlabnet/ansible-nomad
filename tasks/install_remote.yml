---
# File: install_remote.yml - package installation tasks for Nomad (remote)

- name: Install OS packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items: "{{ nomad_os_packages }}"
  tags: installation
  when: not ansible_facts['os_family'] == "VMware Photon OS"

- name: Install OS packages # noqa no-changed-when
  ansible.builtin.command: tdnf install {{ item }}
  with_items: "{{ nomad_os_packages }}"
  tags: installation
  when: ansible_facts['os_family'] == "VMware Photon OS"

- name: Create temporary directory for remote installation
  ansible.builtin.tempfile:
    state: directory
    prefix: ansible-nomad.
  register: nomad_temp_dir

- name: Download and unarchive Nomad
  block:

    - name: Get Nomad checksum
      ansible.builtin.uri:
        url: "{{ nomad_checksum_file_url }}"
        return_content: true
      register: checksum_file
      failed_when: checksum_file.status != 200
      tags:
        - installation

    - name: Find checksum line
      ansible.builtin.set_fact:
        nomad_sha256: "{{ (checksum_file.content.splitlines() | select('search', nomad_pkg) | first).split()[0] }}"
      tags:
        - installation

    - name: Download Nomad # noqa risky-file-permissions
      ansible.builtin.get_url:
        url: "{{ nomad_zip_url }}"
        dest: "{{ nomad_temp_dir.path }}/{{ nomad_pkg }}"
        checksum: sha256:{{ nomad_sha256 }}
        timeout: 42
      register: nomad_download
      tags: installation

    - name: Unarchive Nomad and install binary # noqa no-handler
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ nomad_temp_dir.path }}/{{ nomad_pkg }}"
        dest: "{{ nomad_bin_dir }}"
        owner: "{{ nomad_user }}"
        group: "{{ nomad_group }}"
        mode: "0755"
      when: nomad_download is changed
      tags: installation
  always:
    - name: Cleanup
      ansible.builtin.file:
        path: "{{ nomad_temp_dir.path }}"
        state: absent
      tags: installation
